# ResShift ONNX Export Configuration
# This config is used for exporting the ResShift model to ONNX format

# Model configuration for ResShift v1 (4x Super-Resolution)
model:
  target: models.unet.UNetModelSwin
  ckpt_path: weights/resshift_realsrx4_s15_v1.pth  # Path to the model checkpoint
  params:
    image_size: 64
    in_channels: 3
    model_channels: 160
    out_channels: 3
    attention_resolutions: [64, 32, 16, 8]
    dropout: 0
    channel_mult: [1, 2, 2, 4]
    num_res_blocks: [2, 2, 2, 2]
    conv_resample: True
    dims: 2
    use_fp16: False
    num_head_channels: 32
    use_scale_shift_norm: True
    resblock_updown: False
    swin_depth: 2
    swin_embed_dim: 192
    window_size: 8
    mlp_ratio: 4
    cond_lq: True
    lq_size: 64

# Export settings
export:
  output_path: ~/ResShift/weights/resshift_model.onnx    # Output ONNX file path
  opset_version: 17                   # ONNX opset version
  input_name: input                   # Input tensor name
  output_name: output                 # Output tensor name
  input_shape: [1, 3, 64, 64]         # latent Input shape (batch, channels, height, width)
  do_constant_folding: True           # Enable constant folding optimization
  verbose: False                      # Verbose logging during export
